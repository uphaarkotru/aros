name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aros_ci
          POSTGRES_PASSWORD: aros_ci_only
          POSTGRES_DB: aros_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aros_ci -d aros_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI_DATABASE_URL: postgresql://aros_ci:aros_ci_only@localhost:5432/aros_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build without runtime database configuration
        run: env -u DATABASE_URL npm run build
      - name: Wait for disposable PostgreSQL
        run: until pg_isready -d "$CI_DATABASE_URL"; do sleep 1; done
      - name: Apply every migration and seed disposable database
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: npm run db:migrate && npm run db:seed
      - name: Run PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: npm run test:postgres -- --reporter=json --outputFile=postgres-results.json
      - name: Reject skipped PostgreSQL tests
        run: node -e "const r=require('./postgres-results.json');if(r.numPendingTests||r.numTodoTests)throw new Error('PostgreSQL integration tests were skipped unexpectedly')"
