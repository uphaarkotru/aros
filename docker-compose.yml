services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aros
      POSTGRES_USER: aros
      POSTGRES_PASSWORD: aros_local_only
    ports:
      - "5432:5432"
    volumes:
      - aros_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aros -d aros"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  aros_postgres:
